<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountlessCoupons - Best Promo Codes & Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta name="google-site-verification" content="lto8707sH9Yg6ISIQ1lQPJOIjQY6jGMUHgwAu5hEcLA" />
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-6 text-center shadow-md">
        <h1 class="text-3xl font-bold">🏷️ CountlessCoupons</h1>
        <p class="text-sm text-indigo-200 mt-1">Verified Promo Codes, Vouchers & Exclusive Store Deals</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto my-10 p-4">
        <h2 class="text-xl font-bold mb-6 text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-tags text-indigo-600"></i> Active Promo Codes & Offers
        </h2>
        
        <!-- Promos Container -->
        <div id="promos-list" class="space-y-4">
            <!-- JavaScript will load promos here automatically -->
        </div>
    </main>

    <!-- Script to Load Promo Codes Dynamically -->
    <script>
        async function loadPromos() {
            try {
                let response = await fetch('promo-codes.json');
                let promos = await response.json();
                let container = document.getElementById('promos-list');
                
                container.innerHTML = "";

                promos.forEach(promo => {
                    let card = document.createElement('div');
                    card.className = "bg-white rounded-lg shadow-sm border border-gray-200 p-6 flex flex-col md:flex-row justify-between items-center transition hover:shadow-md";

                    card.innerHTML = `
                        <div class="mb-4 md:mb-0">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-0.5 rounded uppercase">${promo.storeName}</span>
                                <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-0.5 rounded">${promo.badge}</span>
                            </div>
                            <h3 class="text-lg font-bold text-gray-800 mt-1">${promo.title}</h3>
                            <p class="text-sm text-gray-600 mt-1">${promo.description}</p>
                        </div>
                        <div>
                            <a href="${promo.slug}" 
                               class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-md shadow inline-flex items-center gap-2 text-sm whitespace-nowrap">
                                Get Code <i class="fa-solid fa-arrow-right"></i>
                            </a>
                        </div>
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading promos:", error);
            }
        }

        loadPromos();
    </script>
</body>
</html>
