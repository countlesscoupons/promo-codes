<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountlessCoupons - Best Promo Codes & Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-5 text-center shadow-md">
        <h1 class="text-2xl font-bold">🏷️ CountlessCoupons</h1>
        <p class="text-sm text-indigo-200 mt-1">Verified Coupon Codes & Exclusive Deals</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto my-8 p-4">
        <h2 class="text-xl font-bold mb-6 text-gray-800">Latest Active Offers</h2>
        
        <!-- Coupons Container -->
        <div id="coupon-list" class="space-y-4">
            <!-- JavaScript will load coupons here automatically -->
        </div>
    </main>

    <!-- Script to Load Coupons Dynamically -->
    <script>
        async function loadCoupons() {
            try {
                let response = await fetch('coupons.json');
                let coupons = await response.json();
                let container = document.getElementById('coupon-list');
                
                container.innerHTML = "";

                coupons.forEach(coupon => {
                    let card = document.createElement('div');
                    card.className = "bg-white rounded-lg shadow-sm border border-gray-200 p-6 flex flex-col md:flex-row justify-between items-center transition hover:shadow-md";

                    let actionButton = "";
                    if (coupon.type === "code") {
                        actionButton = `<button onclick="revealCode('${coupon.code}', '${coupon.affiliateUrl}')" 
                                class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-md shadow flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-scissors"></i> Get Code
                        </button>`;
                    } else {
                        actionButton = `<a href="${coupon.affiliateUrl}" target="_blank" 
                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-6 rounded-md shadow inline-flex items-center gap-2 text-sm">
                            Get Deal <i class="fa-solid fa-arrow-right"></i>
                        </a>`;
                    }

                    card.innerHTML = `
                        <div class="mb-4 md:mb-0">
                            <span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wide">${coupon.store}</span>
                            <h3 class="text-lg font-bold text-gray-800 mt-2">${coupon.title}</h3>
                            <p class="text-sm text-gray-600 mt-1">${coupon.description}</p>
                        </div>
                        <div>${actionButton}</div>
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading coupons:", error);
            }
        }

        function revealCode(code, affiliateUrl) {
            window.open(affiliateUrl, '_blank');
            navigator.clipboard.writeText(code);
            alert("Coupon Code Copied: " + code + "\nRedirecting to store...");
        }

        loadCoupons();
    </script>
</body>
</html>
