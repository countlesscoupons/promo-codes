name: Generate Sitemap

on:
  workflow_dispatch:
  push:
    paths:
      - 'promo-codes.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate sitemap.xml
        run: |
          node -e '
          const fs = require("fs");
          try {
            const rawData = fs.readFileSync("promo-codes.json", "utf8");
            const promos = JSON.parse(rawData);
            
            let xml = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n";
            xml += "<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n";
            
            xml += "  <url>\n";
            xml += "    <loc>https://countlesscoupons.github.io/promo-codes/</loc>\n";
            xml += "    <changefreq>daily</changefreq>\n";
            xml += "    <priority>1.0</priority>\n";
            xml += "  </url>\n";
            
            promos.forEach(p => {
              if(p.slug) {
                xml += "  <url>\n";
                xml += "    <loc>https://countlesscoupons.github.io/promo-codes/" + p.slug + "</loc>\n";
                xml += "    <changefreq>weekly</changefreq>\n";
                xml += "    <priority>0.8</priority>\n";
                xml += "  </url>\n";
              }
            });
            
            xml += "</urlset>";
            fs.writeFileSync("sitemap.xml", xml);
            console.log("Sitemap generated successfully!");
          } catch (err) {
            console.error("Error building sitemap:", err);
            process.exit(1);
          }
          '

      - name: Commit and push sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto-generate sitemap.xml" || exit 0
          git push
